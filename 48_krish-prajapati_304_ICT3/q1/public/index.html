<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>node practical</title>
</head>

<body>
    <h2>Node Js Practical</h2>
    <button onclick="gethello()">get message</button>

    <h3 id="message"></h3>

    <script>
        function gethello() {
            fetch('/gethello')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('message').innerText = data;
                });
        }
    </script>
</body>

</html>
